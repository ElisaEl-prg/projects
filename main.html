<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login - ALISA COSMETICS</title>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			margin: 0;
			padding: 0;
			display: flex;
			justify-content: center;
			align-items: center;
			min-height: 100vh;
			font-family: 'Inter', sans-serif;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			position: relative;
			overflow: hidden;
		}

		body::before {
			content: '';
			position: absolute;
			width: 500px;
			height: 500px;
			background: rgba(255, 255, 255, 0.1);
			border-radius: 50%;
			top: -250px;
			right: -250px;
			animation: float 20s ease-in-out infinite;
		}

		body::after {
			content: '';
			position: absolute;
			width: 400px;
			height: 400px;
			background: rgba(255, 255, 255, 0.08);
			border-radius: 50%;
			bottom: -200px;
			left: -200px;
			animation: float 15s ease-in-out infinite reverse;
		}

		@keyframes float {
			0%, 100% { transform: translateY(0) rotate(0deg); }
			50% { transform: translateY(-30px) rotate(5deg); }
		}

		.main {
			width: 420px;
			min-height: 600px;
			background: rgba(255, 255, 255, 0.95);
			backdrop-filter: blur(10px);
			overflow: hidden;
			border-radius: 20px;
			box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
			position: relative;
			z-index: 1;
			transition: transform 0.3s ease;
		}

		.main:hover {
			transform: translateY(-5px);
		}

		#chk {
			display: none;
		}

		.signup {
			position: relative;
			width: 100%;
			height: 100%;
			padding: 40px;
			transition: opacity 0.3s ease;
		}

		.login {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			padding: 40px;
			background: rgba(255, 255, 255, 0.98);
			transform: translateY(100%);
			transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
			z-index: 2;
		}

		#chk:checked ~ .login {
			transform: translateY(0);
		}

		#chk:checked ~ .signup {
			opacity: 0;
			pointer-events: none;
		}

		label {
			color: #2d3748;
			font-size: 2em;
			justify-content: center;
			display: flex;
			margin-bottom: 40px;
			font-weight: 600;
			cursor: pointer;
			transition: color 0.3s ease;
			letter-spacing: -0.5px;
		}

		label:hover {
			color: #667eea;
		}

		.form-group {
			position: relative;
			margin-bottom: 25px;
		}

		.form-group i {
			position: absolute;
			left: 15px;
			top: 50%;
			transform: translateY(-50%);
			color: #a0aec0;
			font-size: 16px;
			transition: color 0.3s ease;
		}

		input {
			width: 100%;
			height: 50px;
			background: #f7fafc;
			border: 2px solid #e2e8f0;
			padding: 12px 15px 12px 45px;
			border-radius: 10px;
			outline: none;
			font-size: 15px;
			font-family: 'Inter', sans-serif;
			color: #2d3748;
			transition: all 0.3s ease;
		}

		input::placeholder {
			color: #a0aec0;
		}

		input:focus {
			border-color: #667eea;
			background: #fff;
			box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
		}

		input:focus + i,
		.form-group:has(input:focus) i {
			color: #667eea;
		}

		button {
			width: 100%;
			height: 50px;
			margin-top: 10px;
			color: #fff;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			font-size: 16px;
			font-weight: 600;
			outline: none;
			border: none;
			border-radius: 10px;
			cursor: pointer;
			transition: all 0.3s ease;
			font-family: 'Inter', sans-serif;
			box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
		}

		button:hover {
			transform: translateY(-2px);
			box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
		}

		button:active {
			transform: translateY(0);
		}

		.toggle-container {
			text-align: center;
			margin-top: 30px;
			padding-top: 25px;
			border-top: 1px solid #e2e8f0;
		}

		.toggle-text {
			color: #718096;
			font-size: 14px;
			margin-bottom: 10px;
		}

		.toggle-link {
			color: #667eea;
			font-weight: 600;
			cursor: pointer;
			text-decoration: none;
			transition: color 0.3s ease;
		}

		.toggle-link:hover {
			color: #764ba2;
			text-decoration: underline;
		}

		.brand {
			text-align: center;
			margin-bottom: 10px;
		}

		.brand h1 {
			font-size: 24px;
			color: #2d3748;
			font-weight: 700;
			letter-spacing: -0.5px;
		}

		.brand p {
			font-size: 14px;
			color: #718096;
			margin-top: 5px;
		}

		@media (max-width: 480px) {
			.main {
				width: 90%;
				margin: 20px;
			}

			.signup,
			.login {
				padding: 30px 25px;
			}

			label {
				font-size: 1.75em;
				margin-bottom: 30px;
			}
		}
	</style>
</head>
<body>
	<div class="main">
		<input type="checkbox" id="chk" aria-hidden="true">

		<div class="signup">
			<div class="brand">
				<h1>ALISA COSMETICS</h1>
				<p>Create your account</p>
			</div>
			<form id="signupForm">
				<label for="chk" aria-hidden="true">
					<span>Sign Up</span>
				</label>
				
				<div class="form-group">
					<i class="fas fa-user"></i>
					<input type="text" name="username" placeholder="Username" required>
				</div>

				<div class="form-group">
					<i class="fas fa-envelope"></i>
					<input type="email" name="email" placeholder="Email" required>
				</div>

				<div class="form-group">
					<i class="fas fa-phone"></i>
					<input type="tel" name="phone" placeholder="Phone Number" required>
				</div>

				<div class="form-group">
					<i class="fas fa-lock"></i>
					<input type="password" name="password" placeholder="Password" required>
				</div>

				<button type="submit">Sign Up</button>

				<div class="toggle-container">
					<p class="toggle-text">Already have an account?</p>
					<label for="chk" class="toggle-link">Login here</label>
				</div>
			</form>
		</div>

		<div class="login">
			<div class="brand">
				<h1>ALISA COSMETICS</h1>
				<p>Welcome back</p>
			</div>
			<form id="loginForm">
				<label for="chk" aria-hidden="true">
					<span>Login</span>
				</label>

				<div class="form-group">
					<i class="fas fa-envelope"></i>
					<input type="email" name="email" placeholder="Email" required>
				</div>

				<div class="form-group">
					<i class="fas fa-lock"></i>
					<input type="password" name="password" placeholder="Password" required>
				</div>

				<button type="submit">Login</button>

				<div class="toggle-container">
					<p class="toggle-text">Don't have an account?</p>
					<label for="chk" class="toggle-link">Sign up here</label>
				</div>
			</form>
		</div>
	</div>

	<script>
		// Form submission handlers
		document.getElementById('signupForm').addEventListener('submit', function(e) {
			e.preventDefault();
			// Add your signup logic here
			console.log('Sign up form submitted');
		});

		document.getElementById('loginForm').addEventListener('submit', function(e) {
			e.preventDefault();
			// Add your login logic here
			console.log('Login form submitted');
		});
	</script>
</body>
</html>
